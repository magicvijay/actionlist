[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magicvijay-actionlist"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告提示词的可执行动作清单相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "magicvijay" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://magicvijay.github.io"
Repository = "https://github.com/magicvijay/actionlist"
Issues = "https://github.com/magicvijay/actionlist/issues"

[project.scripts]
actionlist = "actionlist:main"

[tool.setuptools]
py-modules = ["actionlist"]
